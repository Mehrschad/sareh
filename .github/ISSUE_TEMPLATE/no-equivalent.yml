name: وام‌واژه‌ای که برابر ندارد
description: وام‌واژه‌ای که به گمانِ شما جایگزینِ طبیعیِ پارسی ندارد
title: "بی‌برابر: "
labels: [content, no-equivalent]
body:
  - type: markdown
    attributes:
      value: |
        این هم مشارکتِ ارزشمندی است، نه اعترافِ شکست. ادعای اینکه هر وام‌واژه‌ای
        جایگزین دارد نادرست است، و صداقت اعتبارِ محصول را می‌سازد.

  - type: input
    id: loan
    attributes:
      label: وام‌واژه
      placeholder: قانون
    validations:
      required: true

  - type: input
    id: proposed
    attributes:
      label: برابرهایی که پیشنهاد شده‌اند ولی نمی‌نشینند
      placeholder: داد، هنجار

  - type: textarea
    id: reason
    attributes:
      label: چرا نمی‌نشینند؟
      placeholder: |
        «داد» بارِ معناییِ عدالت دارد نه قاعده‌ی حقوقی، و «هنجار» برابرِ norm
        است نه law. جایگزینی در متنِ حقوقی ابهام می‌سازد.
    validations:
      required: true
