# پیکره‌ی ابیات — شاهنامه‌ی فردوسی
#
# این ابیات خوراکِ تمرینِ «بیت‌یاب» (گونه‌ی هفتم) هستند: یک واژه‌ی سره از بیت
# برداشته می‌شود و کاربر آن را بازمی‌گرداند.
#
# هشدار درستی: این ابیات از نسخه‌های پرکاربرد و گزیده‌های مشهور برداشته شده‌اند،
# نه از یک ویراستِ انتقادی. هیچ بیتی نباید status: verified بگیرد مگر آنکه با
# ویراستِ خالقی‌مطلق (بنیاد میراث ایران، ۱۳۶۶–۱۳۸۶) سنجیده و شماره‌ی بیت آن ثبت
# شود. تا آن هنگام status همه needs_review است و CI بیتِ verified بی‌شماره را رد
# می‌کند. بنگرید به content/SOURCES.md.

