# وام‌واژه‌هایی که برابرِ جاافتاده ندارند
#
# این فایل به همان اندازه‌ی content/words/ مهم است. سره پیشنهادگر است، نه
# سرزنش‌گر؛ و ادعای اینکه هر وام‌واژه‌ای جایگزین پارسی دارد، نادرست است. این
# واژه‌ها چنان در بافت زبان تنیده‌اند که جایگزین‌سازی‌شان مصنوعی است.
#
# رفتار اپ: اگر کاربر یکی از اینها را در واژه‌نامه بجوید، به‌جای «یافت نشد»
# این پیام را می‌بیند:
#
#     «برای «قانون» برابر جاافتاده‌ای ثبت نشده.»
#     + توضیحِ reason
#
# افزودن مدخل به این فایل همان‌قدر مشارکتِ ارزشمندی است که افزودن واژه‌ی سره.
# پیشنهادِ حذف از این فهرست باید با شاهدِ کاربردِ زنده همراه باشد، نه با ذوق.

entries:
  - loan: کتاب
    origin: عربی
    proposed: [نامه, نبیگ]
    reason: >-
      «نبیگ» پهلوی است و امروز تنها در متن‌های سره‌گرایانه دیده می‌شود؛ «نامه»
      معنای دیگری گرفته است. «کتاب» بیش از هزار سال است که در پارسی به کار
      می‌رود و در ترکیب‌های زنده (کتابخانه، کتابدار) ریشه دوانده.

  - loan: قانون
    origin: یونانی از راه عربی
    proposed: [داد, هنجار]
    reason: >-
      «داد» بارِ معناییِ عدالت دارد نه قاعده‌ی حقوقی، و «هنجار» برابرِ norm است
      نه law. جایگزینی در متنِ حقوقی ابهام می‌سازد.

  - loan: عشق
    origin: عربی
    proposed: [مهر, دلبستگی]
    reason: >-
      «مهر» و «دلبستگی» هر دو مدخل دارند، ولی هیچ‌کدام شدّتِ «عشق» را نمی‌رسانند.
      ادبیات هزارساله‌ی فارسی این واژه را از آنِ خود کرده است.

  - loan: صبح
    origin: عربی
    proposed: [بامداد]
    reason: >-
      «بامداد» مدخل دارد و در نوشتار زنده است، ولی در گفتارِ روزمره («صبح بخیر»)
      جایگزین نمی‌شود. مدخل هست؛ ادعای جایگزینیِ کامل نیست.
    has_entry: bamdad-sobh

  - loan: نظر
    origin: عربی
    proposed: [دیدگاه]
    reason: >-
      در معنای «دیدگاه» برابر دارد، ولی در «به نظر من» و «نظر داشتن» نمی‌نشیند.
      برابری وابسته به بافت است، نه سراسری.
    has_entry: didgah-nazar

  - loan: ساعت
    origin: عربی
    proposed: [زمان‌سنج, گاه‌نما]
    reason: >-
      هم برای ابزار و هم برای یکای زمان به کار می‌رود؛ هیچ برابرِ ساخته‌ای هر دو
      را نپوشانده و در گفتار پذیرفته نشده است.

  - loan: شهر
    origin: پارسی
    proposed: []
    reason: >-
      وام‌واژه نیست — پارسی است (پهلوی šahr). اینجا آمده چون بارها به‌اشتباه
      عربی پنداشته می‌شود. نمونه‌ای از خطایی که سره‌گراییِ شتاب‌زده می‌سازد.

  - loan: تاریخ
    origin: عربی
    proposed: [گاه‌شمار, سرگذشت]
    reason: >-
      «گاه‌شمار» برابرِ calendar است و مدخل دارد؛ برای history برابرِ جاافتاده‌ای
      ثبت نشده. «سرگذشت» تنها روایتِ فردی را می‌رساند.
    has_entry: gahshomar-taqvim

  - loan: موسیقی
    origin: یونانی از راه عربی
    proposed: [نوا, آهنگ]
    reason: >-
      «آهنگ» برابرِ melody است و مدخل دارد؛ برای musicِ به‌مثابه هنر و دانش،
      برابرِ پذیرفته‌ای نیست.
    has_entry: ahang-melodi

  - loan: طبیعت
    origin: عربی
    proposed: [سرشت, گیتی]
    reason: >-
      «سرشت» برابرِ nature در معنای خوی است، نه در معنای جهانِ زنده. برای معنای
      دوم برابرِ جاافتاده‌ای ثبت نشده.
